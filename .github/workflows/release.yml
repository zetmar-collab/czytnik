name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # ręczne uruchomienie testowe — buduje, ale nie publikuje

permissions:
  contents: write

jobs:
  # Testy interfejsu w Electronie (bez sieci i bez dźwięku). Nieblokujące — środowisko CI
  # nie zawsze ma wyświetlacz; wynik jest informacją, a nie bramką wydania.
  ui-tests:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/make-samples.js
      - name: Testy UI (offline)
        env:
          CZYTNIK_SMOKE: '1'
          CZYTNIK_OFFLINE: '1'
          CZYTNIK_NO_TTS: '1'
        run: |
          npx electron . 2>&1 | Tee-Object -FilePath ui.log; if (Select-String -Path ui.log -Pattern 'WYNIK: SUKCES' -Quiet) { exit 0 } else { exit 1 }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Testy (headless)
        run: npm test

      - name: Budowanie instalatora
        run: npm run dist:win

      - name: Artefakt (uruchomienie testowe)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: instalator-windows
          path: dist/Czytnik-Instalator-*.exe

      - name: Publikacja release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Czytnik ${{ github.ref_name }}
          files: |
            dist/Czytnik-Instalator-*.exe
            dist/Czytnik-Instalator-*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Testy (headless)
        run: npm test

      - name: Budowanie pakietu
        run: npm run dist:linux

      - name: Artefakt (uruchomienie testowe)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: instalator-linux
          path: dist/Czytnik-*.AppImage

      - name: Publikacja release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Czytnik ${{ github.ref_name }}
          files: dist/Czytnik-*.AppImage
          # Opis wydania generuje zadanie build-windows — inaczej oba
          # zadania dopisują go dwa razy do tego samego release'u.
